# Gimmich models: AI models that look at a screen and decide what to click or
# type. The orchestrator reads this list to know which models exist, what
# each one is good at, and where to download it. scripts/get-model.py
# downloads them and checks for updates.
#
#   full  = the original model on Hugging Face (big, for GPUs and training)
#   small = a compressed GGUF copy (4-bit "Q4_K_M") that runs on a normal
#           computer with llama.cpp; "eyes" is the part that reads pictures
#   rev   = the exact version we tested; get-model.py check says when a newer
#           one is out
#   for   = which Gimmich systems it is good at (android, windows, mac,
#           linux, games, web)

[ui-tars-7b]
name = "UI-TARS 1.5 7B"
maker = "ByteDance"
license = "Apache-2.0"
good_at = "Clicking around desktops, phones and games from screenshots"
for = ["windows", "linux", "mac", "android", "games"]
full = "ByteDance-Seed/UI-TARS-1.5-7B"
rev = "683d002dd99d8f95104d31e70391a39348857f4e"
small = "mradermacher/UI-TARS-1.5-7B-GGUF"
small_rev = "ae7049069016c5829821d9af687f144aef72068a"

