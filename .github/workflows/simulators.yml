name: Simulators

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # every Monday at 06:17 UTC, to pick up new versions
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

jobs:
  apple:
    name: iPhone, iPad and Apple Watch (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # xcode-27 is GitHub's macOS 27 machine with Xcode 27 and the iOS 27 simulators.
          - { name: "27", runner: xcode-27 }
          - { name: "26", runner: macos-26 }
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulators and take screenshots
        run: ./scripts/screenshot-simulators.sh screenshots

      - name: List versions
        if: always()
        run: |
          {
            echo "### Apple ${{ matrix.name }}"
            echo '```'
            xcodebuild -version
            cat screenshots/installed-runtimes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.name }}-screenshots
          path: screenshots/

  mac:
    name: Mac ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple M-series chips. (macOS 14 Sonoma was removed: GitHub retires it on Nov 2, 2026.)
          - { name: "27 (M)", runner: xcode-27, file: macos27-m }
          - { name: "Tahoe (M)", runner: macos-26, file: tahoe-m }
          - { name: "Sequoia (M)", runner: macos-15, file: sequoia-m }
          # Intel chip, like Macs from before 2020
          - { name: "Sequoia (Intel)", runner: macos-15-intel, file: sequoia-intel }
    steps:
      - uses: actions/checkout@v5

      - name: Take desktop screenshot
        run: ./scripts/screenshot-mac.sh screenshots mac-${{ matrix.file }}

      - name: List versions
        if: always()
        run: |
          {
            echo "### Mac ${{ matrix.name }}"
            echo '```'
            cat screenshots/mac-${{ matrix.file }}-version.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.file }}-screenshots
          path: screenshots/

  android:
    name: Android ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
          - device: foldable
            profile: auto-fold   # picked below from the folding phones the SDK knows
    steps:
      - uses: actions/checkout@v5

      # Lets the Android emulator use the Linux machine's hardware
      # acceleration (KVM), which makes it fast enough to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ask Google's SDK which Android versions exist and use the newest one.
      - name: Find newest Android version
        id: api
        run: |
          level="$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE 'system-images;android-[0-9]+;google_apis;x86_64' \
            | grep -oE 'android-[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)"
          echo "Newest Android API level: $level"
          echo "level=$level" >> "$GITHUB_OUTPUT"

      # The SDK's names for folding phones change over time, so ask it which
      # ones it has and prefer a Pixel.
      - name: Find device profile
        id: profile
        run: |
          profile="${{ matrix.profile }}"
          if [ "$profile" = "auto-fold" ]; then
            ids="$("$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c 2>/dev/null)"
            echo "Folding devices: $(echo "$ids" | grep -i fold | tr '\n' ' ')"
            profile="$(echo "$ids" | grep -i 'pixel.*fold' | tail -1)"
            [ -n "$profile" ] || profile="$(echo "$ids" | grep -i fold | head -1)"
          fi
          echo "Using device profile: $profile"
          echo "name=$profile" >> "$GITHUB_OUTPUT"

      - name: Boot emulator and take screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.api.outputs.level }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.name }}
          disable-animations: true
          script: |
            mkdir -p screenshots
            # Give the home screen time to finish loading, then close any
            # "isn't responding" popup left over from the busy first boot.
            sleep 60
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell input keyevent KEYCODE_HOME
            sleep 5
            adb shell getprop ro.build.version.release > screenshots/android-version.txt
            adb exec-out screencap -p > "screenshots/android-${{ matrix.device }}.png"
            # Folding phones: close it and take a second photo of the outside screen.
            if [ "${{ matrix.device }}" = "foldable" ]; then adb emu fold && sleep 15 && adb exec-out screencap -p > "screenshots/android-foldable-folded.png" || echo "Could not fold"; fi

      - name: List versions
        if: always()
        run: |
          echo "### Android ${{ matrix.device }}: Android $(cat screenshots/android-version.txt 2>/dev/null) (API ${{ steps.api.outputs.level }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.device }}-screenshots
          path: screenshots/

  windows:
    name: Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "11 (ARM)", runner: windows-11-arm, file: win11-arm }
          - { name: "Server 2025", runner: windows-2025, file: server2025 }
          - { name: "Server 2022", runner: windows-2022, file: server2022 }
    steps:
      - uses: actions/checkout@v5

      - name: Take desktop screenshot
        shell: pwsh
        run: ./scripts/screenshot-windows.ps1 screenshots -MinimizeWindows

      - name: List versions
        if: always()
        shell: pwsh
        run: |
          "### Windows ${{ matrix.name }}" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content screenshots/windows-version.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.file }}-screenshots
          path: screenshots/

  linux:
    name: Linux ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, debian, mint, arch, opensuse, popos, omarchy]
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf python3-pil

      # The ISOs are big, so keep them on the runner's larger /mnt disk.
      - name: Boot newest ${{ matrix.distro }} and take screenshots
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          WORK_DIR=/mnt/work ./scripts/boot-linux.sh ${{ matrix.distro }} screenshots 8

      - name: List versions
        if: always()
        run: |
          echo "### Linux $(cat screenshots/version.txt 2>/dev/null || echo '${{ matrix.distro }} (not found)')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.distro }}-screenshots
          path: screenshots/
